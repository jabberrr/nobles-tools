# XcodeGen spec for Nobles Tools. Generate the project with `xcodegen generate`;
# the .xcodeproj itself is not checked in.
name: NoblesTools

options:
  bundleIdPrefix: com.jabberrr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set to your Apple Developer Team ID (or pick a team in Xcode) to run on a device.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES

packages:
  NoblesKit:
    path: NoblesKit

targets:
  NoblesTools:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: NoblesKit
      - target: NoblesWidgets
        embed: true
      - sdk: WidgetKit.framework
    entitlements:
      path: App/NoblesTools.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jabberrr.noblestools
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nobles Tools
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        CFBundleURLTypes:
          - CFBundleURLName: com.jabberrr.noblestools
            CFBundleURLSchemes:
              - noblestools
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jabberrr.noblestools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  NoblesWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    dependencies:
      - package: NoblesKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/NoblesWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jabberrr.noblestools
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Nobles Tools
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jabberrr.noblestools.widgets
        SKIP_INSTALL: YES

schemes:
  NoblesTools:
    build:
      targets:
        NoblesTools: all
        NoblesWidgets: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
