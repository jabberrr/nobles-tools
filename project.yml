# XcodeGen spec for Nobles Tools: the source of truth for the Xcode project. CI regenerates
# NoblesTools.xcodeproj from this file and commits it, so edit settings here, not in Xcode.
name: NoblesTools

options:
  bundleIdPrefix: app.dabora
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # The Xcode the project was last checked against, so opening it doesn't offer to "update"
  # (and edit) it. Bump it when CI's latest-stable Xcode moves on.
  xcodeVersion: "26.3"

# The development team comes from an optional, gitignored Config/Local.xcconfig.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES

packages:
  NoblesKit:
    path: NoblesKit

targets:
  NoblesTools:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: NoblesKit
      - target: NoblesWidgets
        embed: true
      - sdk: WidgetKit.framework
    entitlements:
      path: App/NoblesTools.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.dabora.noblestools
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nobles Tools
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        CFBundleURLTypes:
          - CFBundleURLName: app.dabora.noblestools
            CFBundleURLSchemes:
              - noblestools
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dabora.noblestools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  NoblesWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    dependencies:
      - package: NoblesKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/NoblesWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.dabora.noblestools
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Nobles Tools
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dabora.noblestools.widgets
        SKIP_INSTALL: YES

  # Renders WidgetGallery to PNGs for the "Render widget previews" workflow.
  WidgetSnapshots:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Snapshots
    dependencies:
      - target: NoblesTools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dabora.noblestools.snapshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NoblesTools.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NoblesTools"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  NoblesTools:
    build:
      targets:
        NoblesTools: all
        NoblesWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WidgetSnapshots
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
