name: Capture API fixtures

# Saves real menu and athletics responses as NoblesKit test fixtures and commits
# them to the branch it runs on. Manual only: tests assert on the captured content,
# so run it after an upstream format changes, then update the tests that read the
# `real-*` fixtures.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://nobleandgreenough.api.flikisdining.com/menu/api
      SCHOOL: noble-and-greenough-school
      OUT: NoblesKit/Tests/NoblesKitTests/Fixtures
    steps:
      - uses: actions/checkout@v5

      - name: Download responses
        run: |
          mkdir -p "$OUT"
          # Image URLs are dropped to keep fixtures small and stable.
          strip='walk(if type == "object" then del(.station_logo, .station_mobile_image, .image, .image_thumbnail, .hoverpic_url, .image_url, .file_url) else . end)'
          monday=$(TZ=America/New_York date -d "next monday" +%Y/%m/%d)
          curl -fsS --retry 3 "$BASE/schools/" | jq "$strip" > "$OUT/real-schools.json"
          for meal in lunch dinner; do
            curl -fsS --retry 3 "$BASE/weeks/school/$SCHOOL/menu-type/$meal/$monday/" | jq "$strip" > "$OUT/real-$meal-week.json"
          done

      - name: Download athletics data
        run: |
          curl -fsS --retry 3 "https://nobilis.nobles.edu/Athletics/endpoints/latest_results.php?page=1" | jq . > "$OUT/real-athletics-results.json"
          curl -fsS --retry 3 "https://nobilis.nobles.edu/Athletics/" -o home.html
          python3 .github/scripts/extract-schedule.py home.html > "$OUT/real-athletics-schedule.html"
          ls -la "$OUT"

      - name: Commit fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "Fixtures unchanged."
            exit 0
          fi
          git commit -m "Capture real API fixtures"
          git push
