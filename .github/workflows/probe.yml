# TEMPORARY: fetches the cafe menus and candidate foil textures for Cafe Wrapped. Deleted after use.
name: Probe (temporary)
on:
  push:
    branches: ["claude/compassionate-heisenberg-84073s"]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Cafe menus
        run: |
          cat > text.py <<'EOF'
          import html, re, sys
          t = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          print("bytes", len(t))
          t = re.sub(r"(?is)<(script|style).*?</\1>", "", t)
          t = re.sub(r"(?i)<br\s*/?>|</(p|div|tr|li|h\d|table)>", "\n", t)
          t = re.sub(r"(?i)</t[dh]>", " | ", t)
          t = html.unescape(re.sub(r"<[^>]+>", "", t))
          lines = [re.sub(r"\s+", " ", l).strip() for l in t.splitlines()]
          print("\n".join(l for l in lines if l)[:30000])
          EOF
          for q in "store_id=5&window_id=3" "store_id=3&window_id=2"; do
            url="https://nobilis.nobles.edu/SchoolStoreDev/menu_print.php?$q"
            echo "=================== $url"
            curl -sS -L -A "Mozilla/5.0" -o page.html -w "status %{http_code} final %{url_effective}\n" "$url" || true
            python3 text.py page.html
          done
      - name: Foil textures (ambientCG, CC0)
        run: |
          curl -sS "https://ambientcg.com/api/v2/full_json?q=foil&include=downloadData,tagData&limit=30" -o acg.json || true
          python3 - <<'EOF'
          import json
          try:
              d = json.load(open("acg.json"))
          except Exception as e:
              print("ambientCG failed:", e); raise SystemExit
          for a in d.get("foundAssets", []):
              files = [f["fileName"] for c in a.get("downloadFolders", {}).values()
                       for cat in c.get("downloadFiletypeCategories", {}).values()
                       for f in cat.get("downloads", [])]
              print(a.get("assetId"), a.get("dataType"), a.get("tags"), [f for f in files if "1K" in f or "2K" in f][:6])
          EOF
      - name: Foil photos (Wikimedia Commons)
        run: |
          curl -sS -A "NoblesToolsProbe/1.0" "https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=crumpled%20aluminium%20foil&gsrnamespace=6&gsrlimit=25&prop=imageinfo&iiprop=url%7Csize%7Cextmetadata&format=json" -o wm.json || true
          python3 - <<'EOF'
          import json
          try:
              d = json.load(open("wm.json"))
          except Exception as e:
              print("commons failed:", e); raise SystemExit
          for p in d.get("query", {}).get("pages", {}).values():
              i = p["imageinfo"][0]; m = i.get("extmetadata", {})
              print(p["title"], i["width"], "x", i["height"], m.get("LicenseShortName", {}).get("value"), i["url"])
          EOF
