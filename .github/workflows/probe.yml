# TEMPORARY: fetches the remaining cafe menus, CC0 foil scans and openly licensed product photos
# for Cafe Wrapped, and commits the downloads to .github/probe-assets for review. Deleted after use.
name: Probe (temporary)
on:
  push:
    branches: ["claude/compassionate-heisenberg-84073s"]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Other menu windows
        run: |
          for store in 5 3; do for window in 1 2 3 4 5 6; do
            url="https://nobilis.nobles.edu/SchoolStoreDev/menu_print.php?store_id=$store&window_id=$window"
            curl -sS -L -o page.html "$url" || continue
            python3 - "$url" <<'EOF'
          import html, re, sys
          t = open("page.html", encoding="utf-8", errors="replace").read()
          t = re.sub(r"(?is)<(script|style).*?</\1>", "", t)
          t = re.sub(r"(?i)<br\s*/?>|</(p|div|tr|li|h\d|table)>", "\n", t)
          t = html.unescape(re.sub(r"<[^>]+>", "", t))
          lines = [re.sub(r"\s+", " ", l).strip() for l in t.splitlines()]
          lines = [l for l in lines if l and not l.startswith("$")]
          print("=====", sys.argv[1], len(lines), "lines")
          print("\n".join(lines[:120]))
          EOF
          done; done
      - name: Download assets
        run: |
          pip install --quiet pillow
          mkdir -p .github/probe-assets/foil .github/probe-assets/brands
          for id in Foil001 Foil002 Foil003; do
            curl -sSL -o "$id.zip" "https://ambientcg.com/get?file=${id}_1K-JPG.zip" && unzip -o -q "$id.zip" -d "$id" || echo "no $id"
            ls "$id" || true
          done
          python3 - <<'EOF'
          import glob, json, os, time, urllib.parse, urllib.request
          from PIL import Image
          for path in glob.glob("Foil00*/*Color*.jpg"):
              name = os.path.basename(path).split("_")[0]
              Image.open(path).convert("RGB").save(f".github/probe-assets/foil/{name}.jpg", quality=85)

          queries = {
              "quaker-oatmeal": "quaker instant oatmeal apple cinnamon",
              "chobani-drink": "chobani yogurt drink mixed berry",
              "chobani-yogurt": "chobani greek yogurt strawberry",
              "gatorade-bar": "gatorade whey protein bar",
              "cheetos-puffs": "cheetos puffs",
              "cheetos-crunchy-hot": "flamin hot cheetos crunchy",
              "lays": "lay's classic potato chips",
              "popcorners": "popcorners sea salt",
              "rice-krispies-treat": "rice krispies treats original",
              "cheez-it": "cheez-it original",
              "chex-mix": "chex mix traditional",
              "miss-vickies": "miss vickie's sea salt kettle",
              "doritos": "doritos nacho cheese",
              "goldfish": "goldfish cheddar crackers",
              "haribo": "haribo goldbears",
              "oreo": "oreo chocolate sandwich cookies",
              "smartfood": "smartfood white cheddar popcorn",
              "stacys": "stacy's pita chips simply naked",
              "sunchips": "sunchips original",
              "cup-noodles": "nissin cup noodles chicken",
              "bodyarmor": "bodyarmor sports drink",
              "boxed-water": "boxed water is better",
              "core-power": "fairlife core power chocolate",
              "fairlife": "fairlife chocolate milk",
              "izze": "izze sparkling clementine",
              "naked": "naked juice mighty mango",
              "polar": "polar seltzer",
              "powerade": "powerade mountain berry blast",
              "nestle-cocoa": "nestle hot cocoa mix",
              "oh-snap": "oh snap pickle",
              "pirates-booty": "pirate's booty aged white cheddar",
              "swoon": "swoon lemonade",
              "arnold-palmer": "arizona arnold palmer half and half",
              "rxbar": "rxbar chocolate sea salt",
              "chips-galore": "chips galore ice cream sandwich",
              "oreo-ice-cream-sandwich": "oreo ice cream sandwich",
              "kings-pretzel": "superpretzel soft pretzel",
          }
          found = {}
          for slug, query in queries.items():
              url = "https://world.openfoodfacts.org/cgi/search.pl?" + urllib.parse.urlencode({
                  "search_terms": query, "search_simple": 1, "action": "process", "json": 1, "page_size": 12,
                  "fields": "code,product_name,brands,image_front_url,unique_scans_n,countries_tags"})
              request = urllib.request.Request(url, headers={"User-Agent": "NoblesTools/1.0"})
              try:
                  products = json.load(urllib.request.urlopen(request, timeout=30)).get("products", [])
              except Exception as error:
                  print(slug, "search failed:", error); time.sleep(7); continue
              products = [p for p in products if p.get("image_front_url")]
              products.sort(key=lambda p: ("en:united-states" in p.get("countries_tags", []), p.get("unique_scans_n") or 0), reverse=True)
              for rank, product in enumerate(products[:2]):
                  target = f".github/probe-assets/brands/{slug}-{rank}.jpg"
                  try:
                      data = urllib.request.urlopen(urllib.request.Request(product["image_front_url"], headers={"User-Agent": "NoblesTools/1.0"}), timeout=30).read()
                      open(target, "wb").write(data)
                      found[f"{slug}-{rank}"] = {k: product.get(k) for k in ("code", "product_name", "brands", "image_front_url", "unique_scans_n")}
                      print(slug, rank, product.get("code"), product.get("product_name"), "|", product.get("brands"))
                  except Exception as error:
                      print(slug, rank, "download failed:", error)
              time.sleep(7)
          json.dump(found, open(".github/probe-assets/brands/brands.json", "w"), indent=1)
          EOF
          du -sh .github/probe-assets/*
      - name: Commit the downloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add .github/probe-assets
          git commit -qm "Probe downloads (temporary)" && git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
