# TEMPORARY: fetches the cafe menus, CC0 foil scans and openly licensed product photos
# for Cafe Wrapped, and commits the downloads to .github/probe-assets for review. Deleted after use.
name: Probe (temporary)
on:
  push:
    branches: ["claude/compassionate-heisenberg-84073s"]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Crop the foil photo at full size
        run: |
          pip install --quiet pillow
          mkdir -p .github/probe-assets/foil3
          curl -sSL -A "NoblesToolsProbe/1.0" -o crumpled.jpg "https://upload.wikimedia.org/wikipedia/commons/4/43/Crumpled_Tin_Foil_%2855598736185%29.jpg"
          curl -sS -A "NoblesToolsProbe/1.0" "https://commons.wikimedia.org/w/api.php?action=query&titles=File:Crumpled_Tin_Foil_(55598736185).jpg&prop=imageinfo&iiprop=extmetadata%7Csize%7Curl&format=json" -o .github/probe-assets/foil3/metadata.json
          python3 - <<'EOF'
          from PIL import Image
          image = Image.open("crumpled.jpg").convert("RGB")
          scale = image.width / 1600
          box = tuple(round(v * scale) for v in (600, 460, 900, 760))
          print(image.size, box)
          image.crop(box).resize((1024, 1024), Image.LANCZOS).save(".github/probe-assets/foil3/foil-texture.jpg", quality=88)
          EOF
      - name: Commit the downloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add .github/probe-assets
          git commit -qm "Probe downloads (temporary)"
          for attempt in 1 2 3; do
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME" && exit 0
            git pull -q --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1
