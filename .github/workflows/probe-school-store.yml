name: Probe school store (temporary)

# One-off, read-only look at how the Nobilis school store pages respond to a logged-out
# visitor: redirects, login mechanism, forms and the endpoints their scripts call.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        shell: python3 {0}
        run: |
          import http.cookiejar, re, urllib.parse, urllib.request
          from html.parser import HTMLParser

          UA = "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          jar = http.cookiejar.CookieJar()

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar), NoRedirect)

          def get(url, hops=8):
              """Follows redirects by hand so every hop is printed."""
              for _ in range(hops):
                  request = urllib.request.Request(url, headers={"User-Agent": UA})
                  try:
                      response = opener.open(request, timeout=20)
                  except urllib.error.HTTPError as error:
                      response = error
                  status = response.status if hasattr(response, "status") else response.code
                  headers = response.headers
                  print(f"  {status} {url}")
                  for name in ("Location", "Content-Type", "Server", "X-Powered-By", "Refresh", "WWW-Authenticate"):
                      if headers.get(name):
                          print(f"      {name}: {headers.get(name)}")
                  for cookie in headers.get_all("Set-Cookie") or []:
                      name, _, rest = cookie.partition("=")
                      attributes = ";".join(rest.split(";")[1:])
                      print(f"      Set-Cookie: {name}=<{len(rest.split(';')[0])} chars>;{attributes}")
                  location = headers.get("Location")
                  if status in (301, 302, 303, 307, 308) and location:
                      url = urllib.parse.urljoin(url, location)
                      continue
                  return url, status, response.read().decode("utf-8", "replace")
              return url, None, ""

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title, self.forms, self.scripts, self.links, self.inline, self.frames = "", [], [], [], [], []
                  self._in_title = self._in_script = False
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "title": self._in_title = True
                  elif tag == "form": self.forms.append({"action": a.get("action"), "method": a.get("method"), "id": a.get("id"), "inputs": []})
                  elif tag in ("input", "select", "textarea", "button") and self.forms:
                      value = a.get("value") or ""
                      shown = value if a.get("type") != "hidden" else (value[:12] + ("…" if len(value) > 12 else ""))
                      self.forms[-1]["inputs"].append(f"{tag}[type={a.get('type')} name={a.get('name')} id={a.get('id')} value={shown!r}]")
                  elif tag == "script":
                      self._in_script = True
                      if a.get("src"): self.scripts.append(a["src"])
                  elif tag in ("iframe", "frame"): self.frames.append(a.get("src"))
                  elif tag == "a" and a.get("href"): self.links.append(a["href"])
                  elif tag == "meta" and (a.get("http-equiv") or "").lower() == "refresh": print(f"      meta refresh: {a.get('content')}")
              def handle_endtag(self, tag):
                  if tag == "title": self._in_title = False
                  if tag == "script": self._in_script = False
              def handle_data(self, data):
                  if self._in_title: self.title += data.strip()
                  if self._in_script and data.strip(): self.inline.append(data)

          ENDPOINT = re.compile(r"""["'`]([^"'`\s]*?(?:\.php|/api/|/endpoints/|ajax|login|logout|auth|sso|saml|oauth)[^"'`\s]*)["'`]""", re.I)
          scripts_seen = set()

          def report(start):
              print(f"\n=== {start}")
              final, status, body = get(start)
              print(f"  final: {status} {final} ({len(body)} bytes)")
              page = Page(); page.feed(body)
              print(f"  title: {page.title!r}")
              for form in page.forms:
                  print(f"  form action={form['action']!r} method={form['method']!r} id={form['id']!r}")
                  for field in form["inputs"]: print(f"      {field}")
              if page.frames: print(f"  frames: {page.frames}")
              print(f"  scripts: {page.scripts}")
              interesting = sorted({l for l in page.links if re.search(r'login|logout|auth|sso|saml|oauth|google|microsoft|store|limit|cafe|balance|account|\.php', l, re.I)})
              print(f"  links ({len(page.links)} total), interesting: {interesting[:60]}")
              inline = "\n".join(page.inline)
              print(f"  endpoints in inline JS: {sorted(set(ENDPOINT.findall(inline)))[:40]}")
              for line in inline.splitlines():
                  if re.search(r'location|\$\.(ajax|get|post)|fetch\(|XMLHttpRequest|student|limit|balance', line, re.I):
                      print(f"      js> {line.strip()[:220]}")
              text = re.sub(r"\s+", " ", re.sub(r"<script.*?</script>|<style.*?</style>|<[^>]+>", " ", body, flags=re.S | re.I)).strip()
              print(f"  visible text: {text[:1500]}")
              for src in page.scripts:
                  url = urllib.parse.urljoin(final, src)
                  if urllib.parse.urlparse(url).netloc != "nobilis.nobles.edu" or url in scripts_seen or re.search(r"jquery|bootstrap|moment|datatables|select2|fontawesome", url, re.I):
                      continue
                  scripts_seen.add(url)
                  _, script_status, script = get(url, hops=2)
                  print(f"  script {url}: {script_status}, {len(script)} bytes, endpoints: {sorted(set(ENDPOINT.findall(script)))[:40]}")
              return final

          for url in (
              "https://nobilis.nobles.edu/SchoolStoreNew/parent_limits.php",
              "https://nobilis.nobles.edu/SchoolStoreNew/",
              "https://nobilis.nobles.edu/",
          ):
              report(url)
          print("\ncookies held:", sorted({c.name for c in jar}))
