name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nobleskit-linux:
    name: NoblesKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test --package-path NoblesKit

  ios:
    name: iOS build + NoblesKit tests (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write # to commit the regenerated Xcode project
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test NoblesKit
        run: swift test --package-path NoblesKit

      # Uses the project's own signing settings, as a fresh clone opened in Xcode would.
      - name: Build app and widget extension
        run: |
          xcodebuild build \
            -project NoblesTools.xcodeproj \
            -scheme NoblesTools \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -quiet

      # Keeps the committed project in sync with project.yml, so a pull is all it takes to open
      # the app in Xcode. Pushes made with GITHUB_TOKEN don't trigger workflows.
      - name: Commit the regenerated Xcode project
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: .github/scripts/commit-xcode-project.sh "$GITHUB_REF_NAME" "${{ github.event.before }}"
