name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nobleskit-linux:
    name: NoblesKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test --package-path NoblesKit

  ios:
    name: iOS build + NoblesKit tests (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test NoblesKit
        run: swift test --package-path NoblesKit

      - name: Build app and widget extension
        run: |
          xcodebuild build \
            -project NoblesTools.xcodeproj \
            -scheme NoblesTools \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
